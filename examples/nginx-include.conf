# Where to include the snippet: once, in the http context, before anything
# keyed on the client address. Debian, Ubuntu, RHEL and nginx.org packages
# already include /etc/nginx/conf.d/*.conf inside http { }, so with the
# default output path there is nothing to add. Check with:
#
#   nginx -T | grep -n 'cloudflare-realip.conf'
#
# If your layout does not include conf.d, add the line below by hand.

http {
    include /etc/nginx/conf.d/cloudflare-realip.conf;

    # Everything keyed on the client address comes after the include, so it
    # sees the visitor address, not the Cloudflare edge.
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

    # ... the rest of your http block ...
}
