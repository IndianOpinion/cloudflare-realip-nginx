# Verification log format (README, "Prove it works").
#
# Put this in the http { } block, after the include of the real-IP snippet,
# then add "access_log /var/log/nginx/realip-check.log realip_check;" to the
# server you want to check. Remove both lines when you are done.
#
#   $remote_addr         the visitor address after real-IP: must be yours
#   $realip_remote_addr  the address the connection came from: a Cloudflare
#                        address for proxied traffic
#   $http_cf_connecting_ip  the raw header, for comparison only. Never key a
#                        rate limit or a blocklist on it.

log_format realip_check '$time_iso8601 remote_addr=$remote_addr '
                        'realip_remote_addr=$realip_remote_addr '
                        'cf_connecting_ip="$http_cf_connecting_ip" '
                        'host=$host request="$request" status=$status';
