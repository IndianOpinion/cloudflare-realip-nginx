name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  BATS_VERSION: v1.11.1

jobs:
  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          shellcheck --version
          shellcheck -x bin/cloudflare-realip-nginx install.sh examples/*.sh \
            tests/helpers/shims/curl tests/helpers/shims/nginx tests/helpers/shims/systemctl \
            tests/helpers/shims/sudo tests/helpers/shims/id tests/helpers/shims/logger \
            tests/helpers/shims/mktemp
          shellcheck -s bash tests/helpers/shims/_seq.bash
          # bats sets $status, $output and $lines and runs "run" in a
          # subshell, which shellcheck cannot see; those checks are off here.
          shellcheck -s bash --severity=warning -e SC2154,SC2030,SC2031,SC2034,SC1091 \
            tests/helpers/common.bash tests/*.bats

  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install bats
        run: |
          git clone --depth 1 --branch "$BATS_VERSION" https://github.com/bats-core/bats-core.git /tmp/bats
          sudo /tmp/bats/install.sh /usr/local
      - name: Unit tests
        run: bats tests

  integration:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:12", "ubuntu:24.04", "rockylinux:9", "alpine:3.20"]
    container: ${{ matrix.image }}
    steps:
      - name: Install packages
        run: |
          if command -v apt-get >/dev/null; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              bash curl ca-certificates git nginx util-linux diffutils procps bsdutils
          elif command -v dnf >/dev/null; then
            dnf install -y --allowerasing bash curl git nginx util-linux diffutils procps-ng which
          else
            apk add --no-cache bash curl git nginx flock diffutils coreutils
          fi
      - uses: actions/checkout@v4
      - name: Install bats
        run: |
          git clone --depth 1 --branch "$BATS_VERSION" https://github.com/bats-core/bats-core.git /tmp/bats
          /tmp/bats/install.sh /usr/local
      - name: Unit and integration tests
        env:
          CFRN_INTEGRATION: "1"
        run: |
          nginx -v
          bats tests

  sandbox:
    name: systemd sandbox (P5)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install nginx and bats
        run: |
          sudo apt-get update
          sudo apt-get install -y nginx
          git clone --depth 1 --branch "$BATS_VERSION" https://github.com/bats-core/bats-core.git /tmp/bats
          sudo /tmp/bats/install.sh /usr/local
      - name: Integration tests as root, including the sandbox
        run: sudo env CFRN_INTEGRATION=1 CFRN_INTEGRATION_SYSTEMD=1 PATH="$PATH" bats tests/integration.bats
